<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto à Venda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .product-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
        .product-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .product-description {
            margin: 20px 0;
        }
        .product-link a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff9900;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .product-link a:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <h1>Quadro de Automação</h1>
        <div class="product-image">
            <img src="url-da-imagem-do-produto" alt="quadro de automação">
        </div>
        <div class="product-description">
            <p>Descrição detalhada do produto.</p>
        </div>
        <div class="product-price">
            <p>Preço: R$ 99,99</p>
        </div>
        <div class="product-link">
            <a href="https://www.mercadolivre.com.br/produto-exemplo" target="_blank">Comprar no Mercado Livre</a>
        </div>
    </div>
</body>
</html>
